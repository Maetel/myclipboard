[package]
name = "mymemo-clipboard"
version = "0.2.3"
description = "Cross-device clipboard history for Jamserver accounts"
authors = ["Jamserver"]
edition = "2021"

[lib]
name = "mymemo_clipboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = "0.10"
arboard = "3.6"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
getrandom = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native"] }
mime_guess = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSPasteboard"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_DataExchange",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
